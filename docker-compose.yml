# Dev-only stack. Runs the app processes against the shared Atlas database in the
# root `.env`; there is deliberately no database service and no data volume.
services:
  backend:
    build: .
    command: npm run dev --workspace backend
    environment:
      # The app defaults to 127.0.0.1 for local dev; inside the container it
      # must bind all interfaces so the published port reaches it.
      HOST: 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the repo so host edits hot-reload inside the container.
      - .:/app
      # Anonymous volumes shadow the host's platform-specific modules with the
      # ones installed inside the image (matters for native deps like bcrypt).
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/packages/node_modules

  frontend:
    build: .
    # `--host` binds Vite to all interfaces so the published port is reachable
    # from the host; it does not change the local `npm run dev` binding.
    command: npm run dev --workspace frontend -- --host
    ports:
      - "5173:5173"
    environment:
      # Point the Vite proxy at the backend service by compose network name.
      # This works because vite.config.ts loads env with an empty prefix, which
      # applies process.env after `.env` — so the container value wins without
      # touching the root `.env`.
      VITE_PROXY_API_TARGET: http://backend:4000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/packages/node_modules
